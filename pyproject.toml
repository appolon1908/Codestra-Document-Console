[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-document-console"
version = "0.1.0"
description = "Human review console for Document Intelligence"
requires-python = ">=3.11"
dependencies = ["fastapi==0.135.2", "uvicorn==0.42.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1", "build==1.4.0"]

[tool.setuptools.package-data]
console = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["console*"]
exclude = ["tests*"]
